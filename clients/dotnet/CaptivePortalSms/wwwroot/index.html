<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2a2c30" />
  <title>SLN Tekstil · Misafir İnternet</title>
  <style>
    :root {
      --brand:        #ff8c00;   /* kurumsal turuncu */
      --brand-deep:   #ec7a00;   /* buton degrade bitişi */
      --brand-glow:   rgba(255,140,0,.30);
      --ink:          #2c2f33;   /* koyu gri (metin) */
      --ink-soft:     #676c72;
      --ink-faint:    #9aa0a6;
      --line:         #e7e9ec;
      --field-bg:     #f6f7f9;
      --card:         #ffffff;
      --ok:           #16a34a;
      --err:          #dc2626;
      --radius:       18px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(160deg, #3c3f44 0%, #2a2c30 70%, #212327 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%; max-width: 400px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px -20px rgba(4,20,45,.55), 0 8px 20px -12px rgba(4,20,45,.35);
      overflow: hidden;
      animation: rise .5s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Header (beyaz zemin + logo) */
    .head {
      background: var(--card); padding: 26px 28px 18px; text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .head .logo { height: 62px; width: auto; max-width: 82%; object-fit: contain; display: block; margin: 0 auto; }
    .head p { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); letter-spacing: .3px; }

    /* Steps indicator */
    .steps { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
    .steps .dot { width: 22px; height: 4px; border-radius: 4px; background: #e3e6ea; transition: background .3s, width .3s; }
    .steps .dot.active { background: var(--brand); width: 30px; }
    .steps .dot.done { background: #f6b76b; }

    /* Body */
    .body { padding: 28px 28px 24px; }
    .field { margin-bottom: 4px; }
    label.lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 0 0 7px; letter-spacing: .2px; }
    input.txt {
      width: 100%; padding: 14px 15px; font-size: 16px; font-family: var(--font);
      color: var(--ink); background: var(--field-bg);
      border: 1.5px solid var(--line); border-radius: 12px; outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input.txt::placeholder { color: var(--ink-faint); }
    input.txt:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--brand-glow); }
    input.code {
      text-align: center; font-size: 26px; font-weight: 600; letter-spacing: 10px; padding-left: 25px;
    }

    button.primary {
      width: 100%; margin-top: 20px; padding: 15px; font-size: 15.5px; font-weight: 600; font-family: var(--font);
      color: #fff; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
      box-shadow: 0 10px 22px -8px var(--brand-glow);
      transition: transform .12s, box-shadow .12s, opacity .15s;
    }
    button.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 26px -8px var(--brand-glow); }
    button.primary:active:not(:disabled) { transform: translateY(0); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

    .consent { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
    .consent input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--brand); flex-shrink: 0; }
    .link { color: var(--brand); font-weight: 600; cursor: pointer; text-decoration: none; border-bottom: 1px solid transparent; }
    .link:hover { border-bottom-color: var(--brand); }

    .hint { font-size: 12px; color: var(--ink-faint); margin-top: 14px; text-align: center; line-height: 1.5; }
    .msg { margin-top: 14px; font-size: 13.5px; text-align: center; min-height: 18px; font-weight: 500; }
    .msg.err { color: var(--err); }
    .msg.ok  { color: var(--ok); }
    .hidden { display: none !important; }
    .back { display: inline-block; margin-top: 16px; font-size: 13px; color: var(--brand); cursor: pointer; }

    /* Success */
    .done-wrap { text-align: center; padding: 8px 0 4px; }
    .check {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
      background: rgba(22,163,74,.1); display: flex; align-items: center; justify-content: center;
      animation: pop .45s cubic-bezier(.2,.9,.3,1.3);
    }
    .check svg { width: 38px; height: 38px; stroke: var(--ok); }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .done-wrap h2 { margin: 0 0 6px; font-size: 20px; color: var(--ink); }
    .done-wrap p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }

    /* Footer */
    .foot { padding: 14px 28px 20px; text-align: center; font-size: 11px; color: var(--ink-faint); border-top: 1px solid var(--line); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(8,20,40,.55); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50;
      animation: fade .2s ease;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: #fff; border-radius: 16px; max-width: 460px; width: 100%; max-height: 84vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(4,20,45,.5);
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
      color: #fff; font-weight: 600; font-size: 15px;
    }
    .modal-x { background: none; border: none; color: #fff; font-size: 26px; line-height: 1; width: auto; margin: 0; padding: 0 4px; cursor: pointer; opacity: .85; }
    .modal-x:hover { opacity: 1; }
    .modal-body {
      padding: 18px 20px; overflow-y: auto; font-size: 13px; line-height: 1.6; color: var(--ink-soft);
      white-space: pre-wrap;
    }
    .modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); }
    .modal-foot button { margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="logo" src="logo.png" alt="SLN Tekstil" />
      <p>Misafir İnternet Erişimi</p>
      <div class="steps">
        <div class="dot active" data-step="1"></div>
        <div class="dot" data-step="2"></div>
        <div class="dot" data-step="3"></div>
      </div>
    </div>

    <div class="body">
      <!-- ADIM 1: Telefon + KVKK onayı -->
      <div id="step-phone">
        <div class="field">
          <label class="lbl" for="phone">Cep telefonu numaranız</label>
          <input id="phone" class="txt" type="tel" inputmode="tel" placeholder="+90 5XX XXX XX XX" autocomplete="tel" />
        </div>
        <label class="consent">
          <input id="consent" type="checkbox" />
          <span><a id="open-policy" class="link">Aydınlatma metnini</a> okudum, kişisel verilerimin belirtilen amaçlarla işlenmesini onaylıyorum.</span>
        </label>
        <button id="btn-send" class="primary" disabled>Doğrulama Kodu Gönder</button>
        <div class="hint">Numaranıza SMS ile 6 haneli bir doğrulama kodu gönderilecektir.</div>
      </div>

      <!-- ADIM 2: Kod -->
      <div id="step-code" class="hidden">
        <div class="field">
          <label class="lbl" for="code">SMS ile gelen kod</label>
          <input id="code" class="txt code" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" />
        </div>
        <button id="btn-verify" class="primary">Doğrula ve Bağlan</button>
        <div class="hint"><span class="back" id="back">‹ Numarayı değiştir</span></div>
      </div>

      <!-- ADIM 3: Başarı -->
      <div id="step-done" class="hidden">
        <div class="done-wrap">
          <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
          </div>
          <h2>Bağlantınız hazır</h2>
          <p>Misafir Wi-Fi erişiminiz etkinleştirildi.<br />İyi günler dileriz.</p>
        </div>
      </div>

      <div id="msg" class="msg"></div>
    </div>

    <div class="foot">© SLN Tekstil ve Moda · Kişisel verileriniz KVKK kapsamında korunur</div>
  </div>

  <!-- Aydınlatma metni popup -->
  <div id="policy-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <span>Aydınlatma Metni</span>
        <button id="close-policy" class="modal-x" aria-label="Kapat">&times;</button>
      </div>
      <div id="policy-body" class="modal-body">Yükleniyor…</div>
      <div class="modal-foot">
        <button id="accept-policy" class="primary" style="margin-top:0;">Okudum, Onaylıyorum</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    let currentPhone = "";
    let policyVersion = null;

    // FortiGate captive portal, yonlendirme URL'ine parametre ekler
    // (usermac, magic, post vb.). Bunlari yakala.
    const fg = new URLSearchParams(location.search);
    const fgMac  = fg.get("usermac") || fg.get("mac") || null;
    const fgPost = fg.get("post");     // http://<fgt>:1000/fgtauth
    const fgMagic = fg.get("magic");

    // OTP basarili + FortiGate parametreleri varsa: fgtauth'a POST -> erisim acilir.
    function completeFortiGate(auth) {
      const f = document.createElement("form");
      f.method = "POST";
      f.action = fgPost;
      const add = (n, v) => {
        const i = document.createElement("input");
        i.type = "hidden"; i.name = n; i.value = v; f.appendChild(i);
      };
      add("4Tredir", (auth && auth.redirect) || "http://www.gstatic.com/generate_204");
      add("magic", fgMagic);
      add("username", auth.username);
      add("password", auth.password);
      document.body.appendChild(f);
      f.submit();
    }

    function show(text, ok) {
      msg.textContent = text || "";
      msg.className = "msg" + (text ? (ok ? " ok" : " err") : "");
    }
    function setStep(n) {
      document.querySelectorAll(".steps .dot").forEach((d) => {
        const s = +d.dataset.step;
        d.classList.toggle("active", s === n);
        d.classList.toggle("done", s < n);
      });
    }
    function goto(step) {
      for (const s of ["step-phone", "step-code", "step-done"]) $(s).classList.add("hidden");
      $(step).classList.remove("hidden");
      setStep(step === "step-phone" ? 1 : step === "step-code" ? 2 : 3);
      show("");
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await res.json(); } catch {}
      return { code: res.status, data };
    }

    // Aydınlatma metnini yükle ve modal içine doldur.
    (async () => {
      try {
        const res = await fetch("/api/consent/policy");
        const data = await res.json();
        policyVersion = data.version;
        $("policy-body").textContent = (data.text || "")
          .replace(/^#{1,6}\s*/gm, "").replace(/\*\*/g, "");
      } catch {
        $("policy-body").textContent = "Aydınlatma metni yüklenemedi.";
      }
    })();

    // Modal aç/kapa/onayla.
    const modal = $("policy-modal");
    $("open-policy").addEventListener("click", () => modal.classList.remove("hidden"));
    $("close-policy").addEventListener("click", () => modal.classList.add("hidden"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });
    $("accept-policy").addEventListener("click", () => {
      $("consent").checked = true;
      $("btn-send").disabled = false;
      modal.classList.add("hidden");
    });

    $("consent").addEventListener("change", () => {
      $("btn-send").disabled = !$("consent").checked;
    });

    $("btn-send").addEventListener("click", async () => {
      const phone = $("phone").value.replace(/[^\d+]/g, "");
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        return show("Lütfen numaranızı +90 ile başlayarak girin.", false);
      }
      if (!$("consent").checked) {
        return show("Devam etmek için aydınlatma metnini onaylayın.", false);
      }
      const btn = $("btn-send");
      btn.disabled = true; show("Kod gönderiliyor…", true);
      try {
        const { code, data } = await api("/api/otp/request", { phone, consentVersion: policyVersion });
        if (code === 200) {
          currentPhone = phone; goto("step-code");
          show("Kod telefonunuza gönderildi.", true);
        } else if (code === 429) {
          show(data.message || "Çok sık istek. Lütfen bekleyin.", false);
        } else {
          show(data.message || "Kod gönderilemedi, tekrar deneyin.", false);
        }
      } catch {
        show("Sunucuya ulaşılamadı.", false);
      } finally { btn.disabled = false; }
    });

    $("btn-verify").addEventListener("click", async () => {
      const code = $("code").value.trim();
      if (!code) return show("Kodu girin.", false);
      const btn = $("btn-verify");
      btn.disabled = true; show("Doğrulanıyor…", true);
      try {
        const { code: status, data } = await api("/api/otp/verify", { phone: currentPhone, code, deviceMac: fgMac });
        if (status === 200) {
          // FortiGate akışındaysak (post+magic var) erişimi aç; değilse başarı ekranı.
          if (fgPost && fgMagic && data.fgAuth && data.fgAuth.username) {
            show("İnternet erişiminiz açılıyor…", true);
            completeFortiGate(data.fgAuth);
          } else {
            goto("step-done");
          }
        } else {
          show(data.message || "Kod hatalı.", false);
        }
      } catch {
        show("Sunucuya ulaşılamadı.", false);
      } finally { btn.disabled = false; }
    });

    $("back").addEventListener("click", () => goto("step-phone"));
  </script>
</body>
</html>
