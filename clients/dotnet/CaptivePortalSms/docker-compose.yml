services:
  captive-portal:
    build: .
    image: sln-captive-portal:latest
    container_name: sln-captive-portal
    restart: unless-stopped
    ports:
      # host:container — misafirler Ubuntu host'un bu portundan erişir
      - "8080:8080"
    environment:
      # Gizli/ortam değerleri .env dosyasından gelir (imaja gömülmez)
      - SmsGateway__BaseUrl=${SMS_GATEWAY_URL}
      - SmsGateway__ApiKey=${SMS_GATEWAY_KEY}
      - Admin__ApiKey=${ADMIN_KEY}
      - Otp__SenderLabel=${SENDER_LABEL:-SLNMODA}
      - Retention__RetentionDays=${RETENTION_DAYS:-730}
    volumes:
      # Yasal kayıtların kalıcılığı — konteyner silinse bile veri durur
      - portal-data:/app/data

volumes:
  portal-data:
