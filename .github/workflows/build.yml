name: Build APK

# Her push ve pull request'te debug APK üretir.
# Manuel tetikleme (workflow_dispatch) da açık.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gerekli SDK bileşenlerini indir
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Birim testleri çalıştır
        run: gradle testDebugUnitTest --no-daemon

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
